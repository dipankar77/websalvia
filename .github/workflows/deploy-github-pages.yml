name: 🌐 Deploy static site to GitHub Pages

# Publishes the contents of static-site/ to GitHub Pages.
# This workflow is independent of master.yml (IONOS SFTP deploy), which is left untouched.

on:
  push:
    branches:
      - master
    paths:
      - 'static-site/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch: {}

# Least-privilege permissions required by the Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 📦 Upload static-site artifact
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload artifact (static-site/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-site

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌍 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
